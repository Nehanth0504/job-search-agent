<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Job dashboard{% endblock %}</title>
{% block head %}{% endblock %}
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#14171f;--mute:#677084;--line:#e6e8ee;--soft:#f0f2f6;
  --accent:#4f46e5;--accent-2:#6d65f1;--accent-ink:#fff;--accent-soft:#eceafd;
  --ok:#0f7a4a;--ok-bg:#e1f6ea;--warn:#8a5a00;--warn-bg:#fff1d2;--bad:#b3261e;--bad-bg:#fde7e5;--info:#1d5fb4;--info-bg:#e4effd;
  --shadow:0 1px 2px rgba(20,23,31,.04),0 4px 14px rgba(20,23,31,.05);--r:14px}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1015;--card:#171a22;--ink:#eceef4;--mute:#8d96aa;--line:#262a36;--soft:#1e222c;
  --accent:#8b85ff;--accent-2:#a29dff;--accent-ink:#0e1015;--accent-soft:#25234a;
  --ok:#6fd8a2;--ok-bg:#12301f;--warn:#f0c26b;--warn-bg:#392d12;--bad:#f59b94;--bad-bg:#3d1f1d;--info:#82b4f5;--info-bg:#16283f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;padding:10px max(20px,calc((100% - 1120px)/2));
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
nav .brand{font-weight:700;letter-spacing:-.01em;margin-right:14px;display:flex;align-items:center;gap:8px}
nav .brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:inline-block}
nav a.tab{padding:7px 13px;border-radius:9px;color:var(--mute);font-weight:500;transition:background .15s,color .15s}
nav a.tab:hover{background:var(--soft);color:var(--ink);text-decoration:none}
nav a.tab.on{background:var(--accent-soft);color:var(--accent)}
nav .sp{flex:1}
main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px;line-height:1.2}
h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600}
.sub{color:var(--mute);margin:0 0 22px}
.section{margin-top:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);transition:transform .15s}
a.card{color:inherit;text-decoration:none}a.card:hover{transform:translateY(-2px)}
.card .n{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.card .l{color:var(--mute);font-size:13px;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel>h2{margin-top:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}tbody tr:hover td{background:var(--soft)}
td .t{font-weight:600;color:var(--ink)}td .t:hover{color:var(--accent)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--soft);color:var(--mute);white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 10px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.pill.hi{background:var(--ok-bg);color:var(--ok)}.pill.mid{background:var(--warn-bg);color:var(--warn)}.pill.lo{background:var(--soft);color:var(--mute)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}.small{font-size:13px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=file],select,textarea{
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);max-width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:96px;resize:vertical}
button,.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);display:inline-block;font-weight:500;transition:background .15s,transform .05s,box-shadow .15s}
button:hover,.btn:hover{background:var(--soft);text-decoration:none}button:active,.btn:active{transform:scale(.98)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
button.primary:hover,.btn.primary:hover{background:var(--accent-2)}
button.danger{color:var(--bad)}
form.inline{display:inline}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs a{padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:500;transition:all .15s}
.tabs a:hover{color:var(--ink);text-decoration:none}.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash{padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:500}
.chips span{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 10px;margin:3px 5px 3px 0;font-size:13px}
.chips.gap span{background:var(--warn-bg);color:var(--warn)}
blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--accent);color:var(--mute);background:var(--soft);border-radius:0 8px 8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr}nav .brand span{display:none}}
.empty{padding:34px 20px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--soft) 0)}
.ring::before{content:"";grid-area:1/1;width:76px;height:76px;border-radius:50%;background:var(--card)}
.ring b{grid-area:1/1;font-size:26px;font-weight:700;letter-spacing:-.02em;z-index:1}
.ring.ok{--c:var(--ok);background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--soft) 0);color:var(--ink)}
.ring.warn{background:conic-gradient(#e0a100 calc(var(--p)*1%),var(--soft) 0);color:var(--ink)}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13.5px}
.checks li::before{content:"✓";color:var(--ok);font-weight:700;margin-right:8px}
.checks li.no::before{content:"✕";color:var(--bad)}
@media (max-width:620px){.checks{grid-template-columns:1fr}}
.files{list-style:none;padding:0;margin:0 0 12px}.files li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.files li:last-child{border:0}
pre.pw{font-size:18px;padding:12px;background:var(--soft);border-radius:10px;user-select:all;overflow-x:auto}
details.panel summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<nav>
  <a class="brand" href="/" style="color:inherit"><i></i><span>Job agent</span></a>
  <a class="tab {{ 'on' if request.path == '/' }}" href="/">Overview</a>
  <a class="tab {{ 'on' if request.path.startswith('/today') }}" href="/today">Today</a>
  <a class="tab {{ 'on' if request.path.startswith('/jobs') }}" href="/jobs">Jobs</a>
  <a class="tab {{ 'on' if request.path.startswith('/insights') }}" href="/insights">Insights</a>
  <a class="tab {{ 'on' if request.path.startswith('/tailor') }}" href="/tailor">Tailor now</a>
  <a class="tab {{ 'on' if request.path.startswith('/resume') }}" href="/resume">My resume</a>
  <a class="tab {{ 'on' if request.path.startswith(('/portals','/vault')) }}" href="/portals">Logins</a>
  <span class="sp"></span>
  <a class="tab" href="/export.csv">Export CSV</a>
</nav>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
    <div class="flash {{ 'ok' if cat == 'ok' else ('warn' if cat == 'warn' else 'bad') }}">{{ msg }}</div>
  {% endfor %}
{% endwith %}
{% block body %}{% endblock %}
</main>
</body>
</html>
